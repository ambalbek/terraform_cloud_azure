name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths: ['workloads/**']

permissions:
  contents: read
  pull-requests: write

env:
  TF_CLOUD_ORGANIZATION: "<TFC_ORG>"
  TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}

jobs:
  detect:
    name: "Detect Changed Workloads"
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.detect.outputs.entries }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workload-environment pairs
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT \
            origin/${{ github.base_ref }}...HEAD -- 'workloads/')

          ENTRIES="[]"

          for FILE in ${CHANGED_FILES}; do
            # Only process files directly under workloads/<workload>/
            DIR=$(dirname "${FILE}")
            WORKLOAD=$(echo "${DIR}" | cut -d'/' -f2)
            BASENAME=$(basename "${FILE}")

            if [[ "${DIR}" != "workloads/${WORKLOAD}" ]]; then
              continue
            fi

            if [[ "${BASENAME}" == *.json ]]; then
              # A specific env json changed -> that single env
              ENV="${BASENAME%.json}"
              ENTRY=$(jq -n -c \
                --arg dir "workloads/${WORKLOAD}" \
                --arg ws "${WORKLOAD}-${ENV}" \
                --arg env "${ENV}" \
                --arg wl "${WORKLOAD}" \
                '{directory: $dir, workspace: $ws, environment: $env, workload: $wl}')
              ENTRIES=$(echo "${ENTRIES}" | jq -c ". + [${ENTRY}]")
            elif [[ "${BASENAME}" == "main.tf" || "${BASENAME}" == "variables.tf" || "${BASENAME}" == "versions.tf" ]]; then
              # Shared TF file changed -> all envs for this workload
              for JSON_FILE in workloads/${WORKLOAD}/*.json; do
                if [[ -f "${JSON_FILE}" ]]; then
                  ENV=$(basename "${JSON_FILE}" .json)
                  ENTRY=$(jq -n -c \
                    --arg dir "workloads/${WORKLOAD}" \
                    --arg ws "${WORKLOAD}-${ENV}" \
                    --arg env "${ENV}" \
                    --arg wl "${WORKLOAD}" \
                    '{directory: $dir, workspace: $ws, environment: $env, workload: $wl}')
                  ENTRIES=$(echo "${ENTRIES}" | jq -c ". + [${ENTRY}]")
                fi
              done
            fi
          done

          # Deduplicate by workspace name
          ENTRIES=$(echo "${ENTRIES}" | jq -c '[group_by(.workspace)[] | .[0]]')

          echo "entries=${ENTRIES}" >> "$GITHUB_OUTPUT"

          if [[ "${ENTRIES}" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "### Detected Workload-Environment Pairs" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${ENTRIES}" | jq '.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: "Plan - ${{ matrix.workspace }}"
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.entries) }}
    concurrency:
      group: tfplan-${{ matrix.workspace }}
      cancel-in-progress: true
    env:
      TF_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=${{ matrix.directory }} fmt -check -diff

      - name: Terraform init
        run: terraform -chdir=${{ matrix.directory }} init

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.directory }} validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          cd ${{ matrix.directory }}
          tflint --init
          tflint

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.directory }}
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Upload configuration (speculative)
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.1
        id: upload
        with:
          workspace: ${{ matrix.workspace }}
          directory: ${{ matrix.directory }}
          speculative: true

      - name: Create speculative plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.1
        id: plan-run
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.1
        id: plan-output
        with:
          plan: ${{ steps.plan-run.outputs.plan_id }}

      - name: Post plan summary as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workspace = '${{ matrix.workspace }}';
            const add = '${{ steps.plan-output.outputs.add }}';
            const change = '${{ steps.plan-output.outputs.change }}';
            const destroy = '${{ steps.plan-output.outputs.destroy }}';
            const runUrl = '${{ steps.plan-run.outputs.run_link }}';

            const body = [
              `### Terraform Plan: \`${workspace}\``,
              '',
              '| Action  | Count |',
              '|---------|-------|',
              `| Add     | ${add} |`,
              `| Change  | ${change} |`,
              `| Destroy | ${destroy} |`,
              '',
              `[View full plan in HCP Terraform](${runUrl})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
