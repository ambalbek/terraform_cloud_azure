name: "Request: Event Hub"

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        description: 'Workload'
        options:
          - sdwan
          - sdwan-fgt
          - hub
          - probe
          - core
          - app
      environment:
        type: choice
        required: true
        description: 'Environment'
        options:
          - dev
          - test
          - qa
          - uat
          - nonprod
          - prod
      region:
        type: choice
        required: true
        description: 'Azure Region'
        options:
          - centralus
          - canadacentral
          - northcentralus
          - southcentralus
          - westeurope
          - northeurope
          - australiaeast
          - australiasoutheast
      namespace_sku:
        type: choice
        description: 'Namespace SKU'
        options:
          - Standard
          - Premium
        default: 'Standard'
      capacity:
        type: choice
        description: 'Throughput units'
        options:
          - '1'
          - '2'
          - '4'
          - '8'
        default: '1'
      role:
        type: string
        required: false
        description: 'Role (optional, lowercase)'
      instance:
        type: string
        required: false
        description: 'Instance (optional, 2 digits e.g. 01)'
      owner:
        type: string
        required: true
        description: 'Owner (team or user)'
      cost_center:
        type: string
        required: true
        description: 'Cost Center'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-request:
    name: "Create Event Hub Request"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ -n "${{ inputs.instance }}" && ! "${{ inputs.instance }}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::Instance must be empty or exactly 2 digits (e.g. 01)"
            exit 1
          fi
          if [[ -n "${{ inputs.role }}" && ! "${{ inputs.role }}" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Role must be empty or lowercase alphanumeric characters only"
            exit 1
          fi

      - name: Generate resource name
        id: naming
        run: |
          case "${{ inputs.region }}" in
            centralus)           REGION_CODE="cus" ;;
            canadacentral)       REGION_CODE="cnc" ;;
            northcentralus)      REGION_CODE="ncus" ;;
            southcentralus)      REGION_CODE="scus" ;;
            westeurope)          REGION_CODE="we" ;;
            northeurope)         REGION_CODE="ne" ;;
            australiaeast)       REGION_CODE="ae" ;;
            australiasoutheast)  REGION_CODE="ase" ;;
            *)
              echo "::error::Unknown region: ${{ inputs.region }}"
              exit 1
              ;;
          esac
          BASE_NAME="evhns-${REGION_CODE}-${{ inputs.environment }}-${{ inputs.workload }}"
          if [[ -n "${{ inputs.role }}" ]]; then BASE_NAME="${BASE_NAME}-${{ inputs.role }}"; fi

          INSTANCE="${{ inputs.instance }}"
          if [[ -z "${INSTANCE}" ]]; then
            # Auto-detect next available instance number
            # Check existing request directories matching this base name
            EXISTING=$(ls -d azure-deployments/requests/${BASE_NAME}* 2>/dev/null | grep -oP '\d{2}$' | sort -n | tail -1)
            if [[ -n "${EXISTING}" ]]; then
              # Increment the highest existing instance
              INSTANCE=$(printf "%02d" $((10#${EXISTING} + 1)))
              echo "::notice::Auto-assigned instance ${INSTANCE} (next after existing ${EXISTING})"
            else
              # Check if the base name (no instance) already exists
              if [[ -d "azure-deployments/requests/${BASE_NAME}" ]]; then
                INSTANCE="02"
                echo "::notice::Base name exists without instance. Assigning instance 02 (rename existing to 01 recommended)"
              fi
              # If nothing exists, no instance suffix needed
            fi
          fi

          DIR_NAME="${BASE_NAME}"
          if [[ -n "${INSTANCE}" ]]; then DIR_NAME="${DIR_NAME}-${INSTANCE}"; fi

          # Block duplicate requests
          if [[ -d "azure-deployments/requests/${DIR_NAME}" ]]; then
            echo "::error::Request '${DIR_NAME}' already exists. Choose a different instance number or leave it empty for auto-assignment."
            exit 1
          fi

          echo "dir_name=${DIR_NAME}" >> "$GITHUB_OUTPUT"
          echo "region_code=${REGION_CODE}" >> "$GITHUB_OUTPUT"
          echo "instance=${INSTANCE}" >> "$GITHUB_OUTPUT"
          echo "### Generated Resource Name" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Namespace:** \`${DIR_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${INSTANCE}" ]]; then
            echo "- **Instance:** \`${INSTANCE}\` (auto-detected)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create request directory
        run: mkdir -p "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"

      - name: Write main.tf
        env:
          DIR_NAME: ${{ steps.naming.outputs.dir_name }}
        run: |
          DIR="azure-deployments/requests/${DIR_NAME}"
          printf '%s\n' \
            'terraform {' \
            '  cloud {' \
            '    organization = "<TFC_ORG>"' \
            '  }' \
            '  required_providers {' \
            '    azurerm = {' \
            '      source  = "hashicorp/azurerm"' \
            '      version = "~> 4.0"' \
            '    }' \
            '  }' \
            '}' \
            '' \
            'provider "azurerm" {' \
            '  features {}' \
            '  use_oidc = true' \
            '}' \
            '' \
            'module "naming" {' \
            '  source  = "app.terraform.io/<TFC_ORG>/naming/azurerm"' \
            '  version = "~> 1.0"' \
            '' \
            '  resource_type = "eventhub_namespace"' \
            '  location      = var.region' \
            '  environment   = var.environment' \
            '  workload      = var.workload' \
            '  role          = var.role' \
            '  instance      = var.instance' \
            '' \
            '  tags = {' \
            '    owner       = var.owner' \
            '    cost_center = var.cost_center' \
            '  }' \
            '}' \
            '' \
            'module "eventhub" {' \
            '  source  = "app.terraform.io/<TFC_ORG>/eventhub/azurerm"' \
            '  version = "~> 1.0"' \
            '' \
            '  namespace_name                = module.naming.name' \
            '  resource_group_name           = var.resource_group_name' \
            '  location                      = var.region' \
            '  namespace_sku                 = var.namespace_sku' \
            '  capacity                      = var.capacity' \
            '  auto_inflate_enabled          = var.auto_inflate_enabled' \
            '  maximum_throughput_units      = var.maximum_throughput_units' \
            '  public_network_access_enabled = false' \
            '  hubs                          = var.hubs' \
            '  tags                          = module.naming.tags' \
            '}' \
            '' \
            'output "namespace_name" { value = module.eventhub.namespace_name }' \
            'output "namespace_id"   { value = module.eventhub.namespace_id }' \
            'output "hub_ids"        { value = module.eventhub.hub_ids }' \
            > "${DIR}/main.tf"

      - name: Write variables.tf
        env:
          DIR_NAME: ${{ steps.naming.outputs.dir_name }}
        run: |
          DIR="azure-deployments/requests/${DIR_NAME}"
          printf '%s\n' \
            'variable "workload"            { type = string }' \
            'variable "environment"         { type = string }' \
            'variable "region"              { type = string }' \
            'variable "role"                { type = string default = null }' \
            'variable "instance"            { type = string default = null }' \
            'variable "resource_group_name" { type = string }' \
            'variable "owner"               { type = string }' \
            'variable "cost_center"         { type = string }' \
            'variable "namespace_sku"           { type = string default = "Standard" }' \
            'variable "capacity"                { type = number default = 1 }' \
            'variable "auto_inflate_enabled"    { type = bool   default = false }' \
            'variable "maximum_throughput_units" { type = number default = 0 }' \
            'variable "hubs" {' \
            '  type = map(object({' \
            '    partition_count   = number' \
            '    message_retention = number' \
            '    consumer_groups = optional(map(object({' \
            '      user_metadata = optional(string, "")' \
            '    })), {})' \
            '  }))' \
            '  default = {}' \
            '}' \
            > "${DIR}/variables.tf"

      - name: Write terraform.tfvars
        env:
          DIR_NAME: ${{ steps.naming.outputs.dir_name }}
          REGION_CODE: ${{ steps.naming.outputs.region_code }}
          WORKLOAD: ${{ inputs.workload }}
          ENVIRONMENT: ${{ inputs.environment }}
          REGION: ${{ inputs.region }}
          ROLE: ${{ inputs.role }}
          INSTANCE: ${{ steps.naming.outputs.instance }}
          OWNER: ${{ inputs.owner }}
          COST_CENTER: ${{ inputs.cost_center }}
          NAMESPACE_SKU: ${{ inputs.namespace_sku }}
          CAPACITY: ${{ inputs.capacity }}
        run: |
          DIR="azure-deployments/requests/${DIR_NAME}"
          cat > "${DIR}/terraform.tfvars" << EOF
          workload            = "${WORKLOAD}"
          environment         = "${ENVIRONMENT}"
          region              = "${REGION}"
          role                = ${ROLE:+\"$ROLE\"}${ROLE:-null}
          instance            = ${INSTANCE:+\"$INSTANCE\"}${INSTANCE:-null}
          resource_group_name = "rg-${REGION_CODE}-${ENVIRONMENT}-${WORKLOAD}"
          owner               = "${OWNER}"
          cost_center         = "${COST_CENTER}"
          namespace_sku            = "${NAMESPACE_SKU}"
          capacity                 = ${CAPACITY}
          auto_inflate_enabled     = false
          maximum_throughput_units = 0
          hubs = {}
          EOF

      - name: Create pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR_NAME: ${{ steps.naming.outputs.dir_name }}
        run: |
          BRANCH="request/${DIR_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "azure-deployments/requests/${DIR_NAME}/"
          git commit -m "feat: request event hub ${DIR_NAME}"
          git push origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --title "Request: Event Hub ${DIR_NAME}" \
            --body "## Event Hub Request
          **Namespace:** \`${DIR_NAME}\`
          **Workload:** ${{ inputs.workload }}
          **Environment:** ${{ inputs.environment }}
          **Region:** ${{ inputs.region }}
          **SKU:** ${{ inputs.namespace_sku }}
          **Capacity:** ${{ inputs.capacity }}
          **Owner:** ${{ inputs.owner }}
          **Cost Center:** ${{ inputs.cost_center }}
          Requested by: @${{ github.actor }}" \
            --base main \
            --head "${BRANCH}")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Add PR to job summary
        run: |
          echo "### Pull Request Created" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR URL:** ${{ steps.create-pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
