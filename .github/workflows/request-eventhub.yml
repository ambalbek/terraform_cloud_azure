name: "Request: Event Hub"

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        description: 'Workload'
        options:
          - sdwan
          - sdwan-fgt
          - hub
          - probe
          - core
          - app
      environment:
        type: choice
        required: true
        description: 'Environment'
        options:
          - dev
          - test
          - qa
          - uat
          - nonprod
          - prod
      region:
        type: choice
        required: true
        description: 'Azure Region'
        options:
          - centralus
          - canadacentral
          - northcentralus
          - southcentralus
          - westeurope
          - northeurope
          - australiaeast
          - australiasoutheast
      key:
        type: string
        required: true
        description: 'Resource key (role[-instance], e.g. db-01, default, internal-02)'
      namespace_sku:
        type: choice
        description: 'Namespace SKU'
        options:
          - Standard
          - Premium
        default: 'Standard'
      capacity:
        type: choice
        description: 'Throughput units'
        options:
          - '1'
          - '2'
          - '4'
          - '8'
        default: '1'
      owner:
        type: string
        required: true
        description: 'Owner (team or user)'
      cost_center:
        type: string
        required: true
        description: 'Cost Center'

jobs:
  request:
    uses: ./.github/workflows/_request.yml
    with:
      workload: ${{ inputs.workload }}
      environment: ${{ inputs.environment }}
      region: ${{ inputs.region }}
      resource_type: eventhub_namespace
      key: ${{ inputs.key }}
      parameters_json: >-
        {
          "namespace_sku": "${{ inputs.namespace_sku }}",
          "capacity": ${{ inputs.capacity }},
          "auto_inflate_enabled": false,
          "maximum_throughput_units": 0,
          "owner": "${{ inputs.owner }}",
          "cost_center": "${{ inputs.cost_center }}",
          "hubs": {}
        }
    secrets: inherit
