name: "Terraform Apply"

on:
  push:
    branches: [main]
    paths: ['workloads/**']

permissions:
  contents: read
  actions: read

env:
  TF_CLOUD_ORGANIZATION: "<TFC_ORG>"
  TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}

jobs:
  detect:
    name: "Detect Changed Workloads"
    runs-on: ubuntu-latest
    outputs:
      nonprod_entries: ${{ steps.detect.outputs.nonprod_entries }}
      prod_entries: ${{ steps.detect.outputs.prod_entries }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      has_nonprod: ${{ steps.detect.outputs.has_nonprod }}
      has_prod: ${{ steps.detect.outputs.has_prod }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workload-environment pairs
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # Handle first push or force push (before is all zeros)
          if [[ "${BEFORE}" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "${BEFORE}" 2>/dev/null; then
            RANGE="HEAD~1...HEAD"
          else
            RANGE="${BEFORE}...${AFTER}"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT ${RANGE} -- 'workloads/' || true)

          ENTRIES="[]"

          for FILE in ${CHANGED_FILES}; do
            DIR=$(dirname "${FILE}")
            WORKLOAD=$(echo "${DIR}" | cut -d'/' -f2)
            BASENAME=$(basename "${FILE}")

            if [[ "${DIR}" != "workloads/${WORKLOAD}" ]]; then
              continue
            fi

            if [[ "${BASENAME}" == *.json ]]; then
              ENV="${BASENAME%.json}"
              if [[ "${ENV}" == "prod" ]]; then
                GH_ENV="prod"
              else
                GH_ENV="nonprod"
              fi
              ENTRY=$(jq -n -c \
                --arg dir "workloads/${WORKLOAD}" \
                --arg ws "${WORKLOAD}-${ENV}" \
                --arg env "${ENV}" \
                --arg wl "${WORKLOAD}" \
                --arg gh_env "${GH_ENV}" \
                '{directory: $dir, workspace: $ws, environment: $env, workload: $wl, gh_environment: $gh_env}')
              ENTRIES=$(echo "${ENTRIES}" | jq -c ". + [${ENTRY}]")
            elif [[ "${BASENAME}" == "main.tf" || "${BASENAME}" == "variables.tf" || "${BASENAME}" == "versions.tf" ]]; then
              for JSON_FILE in workloads/${WORKLOAD}/*.json; do
                if [[ -f "${JSON_FILE}" ]]; then
                  ENV=$(basename "${JSON_FILE}" .json)
                  if [[ "${ENV}" == "prod" ]]; then
                    GH_ENV="prod"
                  else
                    GH_ENV="nonprod"
                  fi
                  ENTRY=$(jq -n -c \
                    --arg dir "workloads/${WORKLOAD}" \
                    --arg ws "${WORKLOAD}-${ENV}" \
                    --arg env "${ENV}" \
                    --arg wl "${WORKLOAD}" \
                    --arg gh_env "${GH_ENV}" \
                    '{directory: $dir, workspace: $ws, environment: $env, workload: $wl, gh_environment: $gh_env}')
                  ENTRIES=$(echo "${ENTRIES}" | jq -c ". + [${ENTRY}]")
                fi
              done
            fi
          done

          # Deduplicate by workspace name
          ENTRIES=$(echo "${ENTRIES}" | jq -c '[group_by(.workspace)[] | .[0]]')

          # Sort: nonprod first, then prod
          ENTRIES=$(echo "${ENTRIES}" | jq -c 'sort_by(.gh_environment) | reverse')

          # Split into nonprod and prod arrays
          NONPROD=$(echo "${ENTRIES}" | jq -c '[.[] | select(.gh_environment == "nonprod")]')
          PROD=$(echo "${ENTRIES}" | jq -c '[.[] | select(.gh_environment == "prod")]')

          echo "nonprod_entries=${NONPROD}" >> "$GITHUB_OUTPUT"
          echo "prod_entries=${PROD}" >> "$GITHUB_OUTPUT"

          if [[ "${ENTRIES}" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${NONPROD}" == "[]" ]]; then
            echo "has_nonprod=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_nonprod=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${PROD}" == "[]" ]]; then
            echo "has_prod=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_prod=true" >> "$GITHUB_OUTPUT"
          fi

          echo "### Detected Workload-Environment Pairs" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Nonprod" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${NONPROD}" | jq '.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "#### Prod" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${PROD}" | jq '.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  apply-nonprod:
    name: "Apply Nonprod - ${{ matrix.workspace }}"
    needs: detect
    if: needs.detect.outputs.has_nonprod == 'true'
    runs-on: ubuntu-latest
    environment: nonprod
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.nonprod_entries) }}
    concurrency:
      group: tfapply-${{ matrix.workspace }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.1
        id: upload
        with:
          workspace: ${{ matrix.workspace }}
          directory: ${{ matrix.directory }}
          speculative: false

      - name: Create run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.1
        id: apply-run
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}

      - name: Read plan for destroy count
        id: plan-check
        env:
          TF_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          RUN_ID="${{ steps.apply-run.outputs.run_id }}"

          # Wait for plan to finish
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${TF_API_TOKEN}" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/runs/${RUN_ID}" \
              | jq -r '.data.attributes.status')
            if [[ "${STATUS}" == "planned" || "${STATUS}" == "cost_estimated" || "${STATUS}" == "policy_checked" ]]; then
              break
            elif [[ "${STATUS}" == "errored" || "${STATUS}" == "canceled" || "${STATUS}" == "force_canceled" ]]; then
              echo "::error::Run entered status: ${STATUS}"
              exit 1
            fi
            sleep 10
          done

          # Get plan resource changes
          PLAN_ID=$(curl -s \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/runs/${RUN_ID}/plan" \
            | jq -r '.data.id')

          PLAN_JSON=$(curl -s \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/plans/${PLAN_ID}/json-output")

          DESTROY_COUNT=$(echo "${PLAN_JSON}" | jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length')
          echo "destroy_count=${DESTROY_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Destroy count: ${DESTROY_COUNT}"

      - name: Destroy guard
        if: steps.plan-check.outputs.destroy_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DESTROY_COUNT="${{ steps.plan-check.outputs.destroy_count }}"
          echo "::warning::Plan includes ${DESTROY_COUNT} resource(s) to destroy."

          # Look up the merged PR for this commit
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0]' 2>/dev/null || echo "null")

          if [[ "${PR_JSON}" == "null" || -z "${PR_JSON}" ]]; then
            echo "::error::No pull request found for commit ${{ github.sha }}. Cannot verify allow-destroy label."
            # Discard the run
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              -H "Content-Type: application/vnd.api+json" \
              -d '{"comment":"Discarded: destroy detected without allow-destroy label"}' \
              "https://app.terraform.io/api/v2/runs/${{ steps.apply-run.outputs.run_id }}/actions/discard"
            exit 1
          fi

          HAS_LABEL=$(echo "${PR_JSON}" | jq -r '[.labels[]?.name] | any(. == "allow-destroy")')

          if [[ "${HAS_LABEL}" != "true" ]]; then
            echo "::error::Destroy detected but PR does not have the 'allow-destroy' label. Discarding run."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              -H "Content-Type: application/vnd.api+json" \
              -d '{"comment":"Discarded: destroy detected without allow-destroy label"}' \
              "https://app.terraform.io/api/v2/runs/${{ steps.apply-run.outputs.run_id }}/actions/discard"
            exit 1
          fi

          echo "allow-destroy label found. Proceeding with apply."

      - name: Confirm and apply run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.1
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply triggered by push to main (commit ${{ github.sha }})"

      - name: Post apply summary
        run: |
          echo "### Terraform Apply: \`${{ matrix.workspace }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID:** \`${{ steps.apply-run.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.apply.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run URL:** ${{ steps.apply-run.outputs.run_link }}" >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: "Apply Prod - ${{ matrix.workspace }}"
    needs: [detect, apply-nonprod]
    if: needs.detect.outputs.has_prod == 'true'
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.prod_entries) }}
    concurrency:
      group: tfapply-${{ matrix.workspace }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.1
        id: upload
        with:
          workspace: ${{ matrix.workspace }}
          directory: ${{ matrix.directory }}
          speculative: false

      - name: Create run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.1
        id: apply-run
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}

      - name: Read plan for destroy count
        id: plan-check
        env:
          TF_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          RUN_ID="${{ steps.apply-run.outputs.run_id }}"

          # Wait for plan to finish
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${TF_API_TOKEN}" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/runs/${RUN_ID}" \
              | jq -r '.data.attributes.status')
            if [[ "${STATUS}" == "planned" || "${STATUS}" == "cost_estimated" || "${STATUS}" == "policy_checked" ]]; then
              break
            elif [[ "${STATUS}" == "errored" || "${STATUS}" == "canceled" || "${STATUS}" == "force_canceled" ]]; then
              echo "::error::Run entered status: ${STATUS}"
              exit 1
            fi
            sleep 10
          done

          # Get plan resource changes
          PLAN_ID=$(curl -s \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/runs/${RUN_ID}/plan" \
            | jq -r '.data.id')

          PLAN_JSON=$(curl -s \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/plans/${PLAN_ID}/json-output")

          DESTROY_COUNT=$(echo "${PLAN_JSON}" | jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length')
          echo "destroy_count=${DESTROY_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Destroy count: ${DESTROY_COUNT}"

      - name: Destroy guard
        if: steps.plan-check.outputs.destroy_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DESTROY_COUNT="${{ steps.plan-check.outputs.destroy_count }}"
          echo "::warning::Plan includes ${DESTROY_COUNT} resource(s) to destroy."

          # Look up the merged PR for this commit
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0]' 2>/dev/null || echo "null")

          if [[ "${PR_JSON}" == "null" || -z "${PR_JSON}" ]]; then
            echo "::error::No pull request found for commit ${{ github.sha }}. Cannot verify allow-destroy label."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              -H "Content-Type: application/vnd.api+json" \
              -d '{"comment":"Discarded: destroy detected without allow-destroy label"}' \
              "https://app.terraform.io/api/v2/runs/${{ steps.apply-run.outputs.run_id }}/actions/discard"
            exit 1
          fi

          HAS_LABEL=$(echo "${PR_JSON}" | jq -r '[.labels[]?.name] | any(. == "allow-destroy")')

          if [[ "${HAS_LABEL}" != "true" ]]; then
            echo "::error::Destroy detected but PR does not have the 'allow-destroy' label. Discarding run."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              -H "Content-Type: application/vnd.api+json" \
              -d '{"comment":"Discarded: destroy detected without allow-destroy label"}' \
              "https://app.terraform.io/api/v2/runs/${{ steps.apply-run.outputs.run_id }}/actions/discard"
            exit 1
          fi

          echo "allow-destroy label found. Proceeding with apply."

      - name: Confirm and apply run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.1
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply triggered by push to main (commit ${{ github.sha }})"

      - name: Post apply summary
        run: |
          echo "### Terraform Apply: \`${{ matrix.workspace }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID:** \`${{ steps.apply-run.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.apply.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run URL:** ${{ steps.apply-run.outputs.run_link }}" >> "$GITHUB_STEP_SUMMARY"
