name: "Request: Storage Account"

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        description: 'Workload'
        options:
          - sdwan
          - sdwan-fgt
          - hub
          - probe
          - core
          - app
      environment:
        type: choice
        required: true
        description: 'Environment'
        options:
          - dev
          - test
          - qa
          - uat
          - nonprod
          - prod
      region:
        type: choice
        required: true
        description: 'Azure Region'
        options:
          - centralus
          - canadacentral
          - northcentralus
          - southcentralus
          - westeurope
          - northeurope
          - australiaeast
          - australiasoutheast
      account_tier:
        type: choice
        description: 'Account Tier'
        options:
          - Standard
          - Premium
        default: 'Standard'
      replication_type:
        type: choice
        description: 'Replication'
        options:
          - LRS
          - GRS
          - ZRS
          - GZRS
        default: 'GRS'
      role:
        type: string
        required: false
        description: 'Role (optional, lowercase)'
      instance:
        type: string
        required: false
        description: 'Instance (optional, 2 digits e.g. 01)'
      owner:
        type: string
        required: true
        description: 'Owner (team or user)'
      cost_center:
        type: string
        required: true
        description: 'Cost Center'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-request:
    name: "Create Storage Account Request"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          # Validate instance (empty or exactly 2 digits)
          if [[ -n "${{ inputs.instance }}" && ! "${{ inputs.instance }}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::Instance must be empty or exactly 2 digits (e.g. 01)"
            exit 1
          fi

          # Validate role (empty or lowercase alphanumeric)
          if [[ -n "${{ inputs.role }}" && ! "${{ inputs.role }}" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Role must be empty or lowercase alphanumeric characters only"
            exit 1
          fi

      - name: Generate resource name
        id: naming
        run: |
          # Map Azure region to short code
          case "${{ inputs.region }}" in
            centralus)           REGION_CODE="cus" ;;
            canadacentral)       REGION_CODE="cnc" ;;
            northcentralus)      REGION_CODE="ncus" ;;
            southcentralus)      REGION_CODE="scus" ;;
            westeurope)          REGION_CODE="weu" ;;
            northeurope)         REGION_CODE="neu" ;;
            australiaeast)       REGION_CODE="aue" ;;
            australiasoutheast)  REGION_CODE="ause" ;;
            *)
              echo "::error::Unknown region: ${{ inputs.region }}"
              exit 1
              ;;
          esac

          # Build resource name: st<region_code><environment><workload>[<role>][<instance>]
          # Storage accounts cannot have hyphens, so strip them from workload
          WORKLOAD=$(echo "${{ inputs.workload }}" | tr -d '-')
          RESOURCE_NAME="st${REGION_CODE}${{ inputs.environment }}${WORKLOAD}"

          if [[ -n "${{ inputs.role }}" ]]; then
            RESOURCE_NAME="${RESOURCE_NAME}${{ inputs.role }}"
          fi

          if [[ -n "${{ inputs.instance }}" ]]; then
            RESOURCE_NAME="${RESOURCE_NAME}${{ inputs.instance }}"
          fi

          DIR_NAME="${RESOURCE_NAME}"

          echo "resource_name=${RESOURCE_NAME}" >> "$GITHUB_OUTPUT"
          echo "dir_name=${DIR_NAME}" >> "$GITHUB_OUTPUT"
          echo "region_code=${REGION_CODE}" >> "$GITHUB_OUTPUT"

          echo "### Generated Resource Name" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Resource Name:** \`${RESOURCE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Directory:** \`azure-deployments/requests/${DIR_NAME}/\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create request directory
        run: mkdir -p "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"

      - name: Write main.tf
        run: |
          cat > "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}/main.tf" << 'TFEOF'
          module "storage_account" {
            source  = "app.terraform.io/<TFC_ORG>/storage-account/azurerm"
            version = "~> 1.0"
          }
          TFEOF

      - name: Write terraform.tfvars
        run: |
          cat > "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}/terraform.tfvars" << TFVARSEOF
          resource_name    = "${{ steps.naming.outputs.resource_name }}"
          workload         = "${{ inputs.workload }}"
          environment      = "${{ inputs.environment }}"
          region           = "${{ inputs.region }}"
          region_code      = "${{ steps.naming.outputs.region_code }}"
          account_tier     = "${{ inputs.account_tier }}"
          replication_type = "${{ inputs.replication_type }}"
          role             = "${{ inputs.role }}"
          instance         = "${{ inputs.instance }}"
          owner            = "${{ inputs.owner }}"
          cost_center      = "${{ inputs.cost_center }}"
          tenant_id        = "<TENANT_ID>"
          subscription_id  = "<SUB_ID>"
          TFVARSEOF

      - name: Create pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="request/${{ steps.naming.outputs.dir_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}/"
          git commit -m "feat: request storage account ${{ steps.naming.outputs.resource_name }}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --title "Request: Storage Account ${{ steps.naming.outputs.resource_name }}" \
            --body "## Storage Account Request

          **Resource Name:** \`${{ steps.naming.outputs.resource_name }}\`
          **Workload:** ${{ inputs.workload }}
          **Environment:** ${{ inputs.environment }}
          **Region:** ${{ inputs.region }}
          **Account Tier:** ${{ inputs.account_tier }}
          **Replication:** ${{ inputs.replication_type }}
          **Owner:** ${{ inputs.owner }}
          **Cost Center:** ${{ inputs.cost_center }}

          Requested by: @${{ github.actor }}" \
            --base main \
            --head "${BRANCH}")

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Add PR to job summary
        run: |
          echo "### Pull Request Created" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR URL:** ${{ steps.create-pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
