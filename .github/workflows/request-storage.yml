name: "Request: Storage Account"

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        description: 'Workload'
        options:
          - sdwan
          - sdwan-fgt
          - hub
          - probe
          - core
          - app
      environment:
        type: choice
        required: true
        description: 'Environment'
        options:
          - dev
          - test
          - qa
          - uat
          - nonprod
          - prod
      region:
        type: choice
        required: true
        description: 'Azure Region'
        options:
          - centralus
          - canadacentral
          - northcentralus
          - southcentralus
          - westeurope
          - northeurope
          - australiaeast
          - australiasoutheast
      account_tier:
        type: choice
        description: 'Account Tier'
        options:
          - Standard
          - Premium
        default: 'Standard'
      replication_type:
        type: choice
        description: 'Replication'
        options:
          - LRS
          - GRS
          - ZRS
          - GZRS
        default: 'GRS'
      role:
        type: string
        required: false
        description: 'Role (optional, lowercase)'
      instance:
        type: string
        required: false
        description: 'Instance (optional, 2 digits e.g. 01)'
      owner:
        type: string
        required: true
        description: 'Owner (team or user)'
      cost_center:
        type: string
        required: true
        description: 'Cost Center'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-request:
    name: "Create Storage Account Request"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          # Validate instance (empty or exactly 2 digits)
          if [[ -n "${{ inputs.instance }}" && ! "${{ inputs.instance }}" =~ ^[0-9]{2}$ ]]; then
            echo "::error::Instance must be empty or exactly 2 digits (e.g. 01)"
            exit 1
          fi

          # Validate role (empty or lowercase alphanumeric)
          if [[ -n "${{ inputs.role }}" && ! "${{ inputs.role }}" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Role must be empty or lowercase alphanumeric characters only"
            exit 1
          fi

      - name: Generate resource name
        id: naming
        run: |
          # Map Azure region to short code
          case "${{ inputs.region }}" in
            centralus)           REGION_CODE="cus" ;;
            canadacentral)       REGION_CODE="cnc" ;;
            northcentralus)      REGION_CODE="ncus" ;;
            southcentralus)      REGION_CODE="scus" ;;
            westeurope)          REGION_CODE="we" ;;
            northeurope)         REGION_CODE="ne" ;;
            australiaeast)       REGION_CODE="ae" ;;
            australiasoutheast)  REGION_CODE="ase" ;;
            *)
              echo "::error::Unknown region: ${{ inputs.region }}"
              exit 1
              ;;
          esac

          # Build standard name: st-<region_code>-<environment>-<workload>[-<role>][-<instance>]
          DIR_NAME="st-${REGION_CODE}-${{ inputs.environment }}-${{ inputs.workload }}"

          if [[ -n "${{ inputs.role }}" ]]; then
            DIR_NAME="${DIR_NAME}-${{ inputs.role }}"
          fi

          if [[ -n "${{ inputs.instance }}" ]]; then
            DIR_NAME="${DIR_NAME}-${{ inputs.instance }}"
          fi

          # Azure storage account name: same components, no hyphens (3-24 lowercase alphanumeric)
          RESOURCE_NAME=$(echo "${DIR_NAME}" | tr -d '-')

          echo "resource_name=${RESOURCE_NAME}" >> "$GITHUB_OUTPUT"
          echo "dir_name=${DIR_NAME}" >> "$GITHUB_OUTPUT"
          echo "region_code=${REGION_CODE}" >> "$GITHUB_OUTPUT"

          echo "### Generated Resource Name" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Resource Name:** \`${RESOURCE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Directory:** \`azure-deployments/requests/${DIR_NAME}/\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create request directory
        run: mkdir -p "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"

      - name: Write main.tf
        run: |
          DIR="azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"
          cat > "${DIR}/main.tf" <<'TFEOF'
terraform {
  cloud {
    organization = "<TFC_ORG>"
  }

  required_providers {
    azurerm = {
      source  = "hashicorp/azurerm"
      version = "~> 4.0"
    }
  }
}

provider "azurerm" {
  features {}
  use_oidc = true
}

module "naming" {
  source  = "app.terraform.io/<TFC_ORG>/naming/azurerm"
  version = "~> 1.0"

  resource_type = "storage_account"
  location      = var.region
  environment   = var.environment
  workload      = var.workload
  role          = var.role
  instance      = var.instance

  tags = {
    owner       = var.owner
    cost_center = var.cost_center
  }
}

module "storage_account" {
  source  = "Azure/avm-res-storage-storageaccount/azurerm"
  version = "~> 0.11"

  name                          = module.naming.name
  location                      = var.region
  resource_group_name           = var.resource_group_name
  account_tier                  = var.account_tier
  account_replication_type      = var.replication_type
  account_kind                  = var.account_kind
  access_tier                   = var.access_tier
  public_network_access_enabled = false
  min_tls_version               = "TLS1_2"
  shared_access_key_enabled     = false

  tags = module.naming.tags
}

output "storage_account_name" {
  value = module.storage_account.name
}

output "storage_account_id" {
  value = module.storage_account.resource_id
}
TFEOF

      - name: Write variables.tf
        run: |
          DIR="azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"
          cat > "${DIR}/variables.tf" <<'TFEOF'
variable "workload"            { type = string }
variable "environment"         { type = string }
variable "region"              { type = string }
variable "role"                { type = string default = null }
variable "instance"            { type = string default = null }
variable "resource_group_name" { type = string }
variable "account_tier"        { type = string default = "Standard" }
variable "replication_type"    { type = string default = "GRS" }
variable "account_kind"        { type = string default = "StorageV2" }
variable "access_tier"         { type = string default = "Hot" }
variable "owner"               { type = string }
variable "cost_center"         { type = string }
TFEOF

      - name: Write terraform.tfvars
        run: |
          DIR="azure-deployments/requests/${{ steps.naming.outputs.dir_name }}"
          cat > "${DIR}/terraform.tfvars" <<TFVARSEOF
workload            = "${{ inputs.workload }}"
environment         = "${{ inputs.environment }}"
region              = "${{ inputs.region }}"
role                = "${{ inputs.role }}"
instance            = "${{ inputs.instance }}"
resource_group_name = "rg-${{ steps.naming.outputs.region_code }}-${{ inputs.environment }}-${{ inputs.workload }}"
account_tier        = "${{ inputs.account_tier }}"
replication_type    = "${{ inputs.replication_type }}"
account_kind        = "StorageV2"
access_tier         = "Hot"
owner               = "${{ inputs.owner }}"
cost_center         = "${{ inputs.cost_center }}"
TFVARSEOF

      - name: Create pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="request/${{ steps.naming.outputs.dir_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add "azure-deployments/requests/${{ steps.naming.outputs.dir_name }}/"
          git commit -m "feat: request storage account ${{ steps.naming.outputs.resource_name }}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --title "Request: Storage Account ${{ steps.naming.outputs.resource_name }}" \
            --body "## Storage Account Request

          **Resource Name:** \`${{ steps.naming.outputs.resource_name }}\`
          **Workload:** ${{ inputs.workload }}
          **Environment:** ${{ inputs.environment }}
          **Region:** ${{ inputs.region }}
          **Account Tier:** ${{ inputs.account_tier }}
          **Replication:** ${{ inputs.replication_type }}
          **Owner:** ${{ inputs.owner }}
          **Cost Center:** ${{ inputs.cost_center }}

          Requested by: @${{ github.actor }}" \
            --base main \
            --head "${BRANCH}")

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Add PR to job summary
        run: |
          echo "### Pull Request Created" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR URL:** ${{ steps.create-pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
